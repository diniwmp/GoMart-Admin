<!DOCTYPE html>
<html>
    <head>
        <title>GoMart Admin</title>
        <link rel="icon" type="image/png" href="images/logo.png"" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background: #f1f5f9;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
            }
            .card {
                border-radius: 14px;
                border: 1px solid #e2e8f0;
                padding: 36px 32px;
                width: 100%;
                max-width: 380px;
            }
            .btn-green {
                background: #22c55e;
                color: #fff;
                border: none;
                width: 100%;
                padding: 11px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
            }
            .btn-green:hover {
                background: #16a34a;
                color: #fff;
            }
            input:focus {
                border-color: #22c55e !important;
                box-shadow: 0 0 0 3px #22c55e20 !important;
            }
        </style>
    </head>
    <body>
        <div class="card bg-white shadow-sm">
            <div class="text-center mb-4">
                <img src="images/logo.png" alt="GoMart" style="width:80px;height:80px;border-radius:10px;">
                <h5 class="mt-2 mb-0">GoMart</h5>
                <small class="text-muted">Sign in to admin panel</small>
            </div>

            <div id="errorMsg" class="alert alert-danger d-none py-2 text-center" style="font-size:13px"></div>

            <div class="mb-3">
                <label class="form-label" style="font-size:13px">Email address</label>
                <input type="email" id="email" class="form-control" placeholder="admin@gomart.com">
            </div>
            <div class="mb-3">
                <label class="form-label" style="font-size:13px">Password</label>
                <input type="password" id="password" class="form-control" placeholder=".......">
            </div>
            <button class="btn btn-green" id="signinBtn" onclick="handleSignin()">Sign in</button>

            <p class="text-center text-muted mt-3 mb-0" style="font-size:11px">
                Only authorized GoMart staff can access this panel
            </p>
        </div>

        <script type="module" src="js/auth.js"></script>
    </body>
</html>
